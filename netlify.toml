[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Keep Netlify builds and Agent Runners on the same supported LTS release.
  NODE_VERSION = "22"

# SPA fallback: serve index.html for every route so React Router
# handles /about, /products/diesel, etc. on direct visits and refreshes.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
